name: Statistics tool tests

# Unit tests for tools/stats, the puller behind the UI test statistics dashboard.
#
# Scoped to its own paths: this repository exists to run PrestaShop UI test campaigns, and
# a pull request that only touches those workflows has no reason to pay for this.
#
# The suite is offline. It runs against recorded API responses and real job logs committed
# under tools/stats/fixtures, so it needs no token, no network and no rate limit.
#
# It also type-checks and lints, because the collector is TypeScript and a Vue dashboard: the
# build is the thing the scheduled workflow depends on, so a break here is worth catching in
# the pull request rather than at 05:17 the next morning.

on:
  pull_request:
    paths:
      - 'tools/stats/**'
      - '.github/workflows/stats-tests.yml'
      - '.github/workflows/stats.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/stats/**'
      - '.github/workflows/stats-tests.yml'
      - '.github/workflows/stats.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: tools/stats

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the scheduled workflow. 24 rather than 20 for the npm that ships with it:
          # npm 10.8 crashes resolving Vitest's optional peer dependencies.
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/stats/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run the tests
        run: npm test

      - name: Check the command-line entry point still starts
        run: node dist/run.js --help
